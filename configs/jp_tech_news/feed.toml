# 国内の技術記事を集める feed 一覧(viewer の「国内」タブ)。
# 書式は configs/tech_news/feed.toml と同じ。`keywords` は任意で、指定すると
# title / summary / content に一致した記事だけを残す。
# 日本語を含む URL はパーセントエンコードして書く(そのままだと Zenn が 400 を返す)。
# 各 feed から 1 日あたり最大 10 件、同じ URL は 1 件にまとめる。

[[feeds]]
name = "zenn-trending"
url = "https://zenn.dev/feed"
feed_name_display = "Zenn Trending"

[[feeds]]
name = "zenn-llm"
url = "https://zenn.dev/topics/llm/feed"
feed_name_display = "Zenn LLM"

[[feeds]]
name = "zenn-machine-learning"
url = "https://zenn.dev/topics/machinelearning/feed"
feed_name_display = "Zenn Machine Learning"
keywords = [
    "Transformer",
    "LLM",
    "KV Cache",
    "KVキャッシュ",
    "強化学習",
    "推論",
    "長文脈",
    "Attention",
    "MCTS",
]

