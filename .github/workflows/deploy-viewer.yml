# main に viewer の変更が入ったら、検査を通してから Cloudflare Workers にデプロイする(#26)
name: deploy-viewer

on:
  push:
    branches: [main]
    paths:
      - nook/deploy/cloudflare/viewer/**
      - nook/services/viewer/static/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-viewer
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: github.repository == 'shiyow5/nook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: nook/deploy/cloudflare/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nook/deploy/cloudflare/viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      # secrets(GOOGLE_API_KEY、GITHUB_TOKEN)は Cloudflare 側に登録済みで、deploy では上書きしない
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
