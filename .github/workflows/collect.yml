# collector を GitHub Actions で動かし、結果を Cloudflare R2 に保存する。
# viewer(Cloudflare Worker)の Retry ボタンからは workflow_dispatch で 1 件だけ実行される。
name: collect

on:
  schedule:
    # 毎日 06:17 JST(GitHub の cron は UTC)。毎時 0 分は混雑で予定実行が落ちやすいので分をずらす(#31)
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      collectors:
        description: "実行する collector(カンマ区切り)。空なら変数 NOOK_ENABLED_COLLECTORS"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.collectors || 'scheduled' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
    steps:
      # 公開リポジトリなので、外部 Action はタグではなくコミット SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # secrets はこの step にだけ渡す(上の外部 Action からは見えない)
      - name: Run collectors
        env:
          COLLECTORS: ${{ inputs.collectors || vars.NOOK_ENABLED_COLLECTORS }}
          NOOK_RUNTIME_MODE: local
          NOOK_STORAGE_BACKEND: s3
          BUCKET_NAME: ${{ vars.R2_BUCKET }}
          NOOK_S3_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          NOOK_S3_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 は boto3 既定のチェックサム付与と相性が悪いことがあるため、必要時のみにする
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 同じ入力の要約は R2 の _state/llm_cache/ から再利用し、LLM を呼ばない(#2)
          NOOK_LLM_RESPONSE_CACHE: enabled
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          PRODUCT_HUNT_API_KEY: ${{ secrets.PRODUCT_HUNT_API_KEY }}
          PRODUCT_HUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCT_HUNT_DEVELOPER_TOKEN }}
        run: uv run --no-sync python -m nook.deploy.github.run_collectors "$COLLECTORS"
