# Pull Request と main への push で、Python と viewer Worker の検査を行う(#26)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 公開リポジトリなので、外部 Action はタグではなくコミット SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # tests/unit/test_viewer_frontend.py が viewer.js を node で評価する
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: ruff format
        run: uv run --no-sync ruff format --check .

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: pytest
        run: uv run --no-sync pytest

  viewer:
    name: viewer (tsc, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nook/deploy/cloudflare/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nook/deploy/cloudflare/viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: wrangler dry-run build
        run: npx wrangler deploy --dry-run --outdir dist
